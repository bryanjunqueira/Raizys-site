  <!-- Script Header Scroll & Video Autoplay Force -->
  <script>
    // Forçar início do vídeo sem bloqueio do navegador
    const v = document.getElementById('lp-hero-video');
    if (v) {
      v.muted = true;
      v.play().catch(() => {
        // Fallback no primeiro toque/clique caso o navegador restrinja
        const startPlay = () => {
          v.play();
          window.removeEventListener('click', startPlay);
          window.removeEventListener('touchstart', startPlay);
        };
        window.addEventListener('click', startPlay, { once: true });
        window.addEventListener('touchstart', startPlay, { once: true });
      });
    }

    // Header scroll background
    const header = document.getElementById('lp-header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 40) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    }, { passive: true });
  </script>
