  <!-- Estilos inline garantindo 100% de imunidade a cache de CDN/Navegador em produção -->
  <style>
    :root {
      --primary-blue: #0066FF;
      --primary-blue-hover: #0052CC;
      --primary-blue-glow: rgba(0, 102, 255, 0.35);
      --primary-blue-light: #388BFF;
      --bg-dark: #040914;
      --text-white: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.88);
      --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* HEADER FIXO NO TOPO (NÃO DESCE AO SCROLLAR) */
    .lp-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 56px;
      background: transparent;
    }

    .lp-header-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
    }

    .lp-header-logo img {
      height: 76px;
      width: auto;
      object-fit: contain;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.7));
    }

    .lp-header-logo:hover img {
      transform: scale(1.03);
    }

    /* HERO SECTION */
    .lp-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      padding: 130px 56px 60px;
    }

    .lp-hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      z-index: 0;
      pointer-events: none;
    }

    /* OVERLAY DE ILUMINAÇÃO: ESQUERDA ESCURA P/ TEXTO E DIREITA TOTALMENTE TRANSLÚCIDA P/ VÍDEO */
    .lp-hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: 
        linear-gradient(
          to right,
          rgba(4, 9, 20, 0.98) 0%,
          rgba(4, 9, 20, 0.92) 26%,
          rgba(4, 9, 20, 0.60) 45%,
          rgba(4, 9, 20, 0.15) 60%,
          rgba(4, 9, 20, 0.0) 75%,
          rgba(4, 9, 20, 0.0) 100%
        ),
        linear-gradient(
          to top,
          rgba(4, 9, 20, 0.70) 0%,
          transparent 18%
        ),
        linear-gradient(
          to bottom,
          rgba(4, 9, 20, 0.50) 0%,
          transparent 14%
        );
    }

    .lp-hero-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .lp-hero-content {
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      transform: translateY(-35px);
    }

    .lp-hero-title {
      font-family: var(--font-heading);
      font-size: 38px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-white);
      text-transform: none;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);
    }

    .lp-hero-subtitle {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 520px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .lp-hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary-blue);
      color: var(--text-white);
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0.2px;
      padding: 14px 28px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px var(--primary-blue-glow);
      text-decoration: none;
    }

    .lp-hero-btn:hover {
      background-color: var(--primary-blue-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 102, 255, 0.55);
    }

    /* WHATSAPP FLUTUANTE COM BALÃO DE FALA */
    .lp-wa-wrapper {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .lp-wa-bubble {
      position: relative;
      background: #ffffff;
      border-radius: 10px;
      padding: 14px 18px 14px 16px;
      max-width: 290px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.28), 0 2px 8px rgba(0, 0, 0, 0.12);
      pointer-events: auto;
      animation: waBubbleSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s backwards;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    }

    .lp-wa-bubble.hidden {
      opacity: 0;
      transform: translateX(14px) scale(0.92);
      pointer-events: none;
      visibility: hidden;
    }

    @keyframes waBubbleSlideIn {
      0% {
        opacity: 0;
        transform: translateX(24px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .lp-wa-bubble-close {
      position: absolute;
      top: -9px;
      left: -9px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.88);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      z-index: 10;
      padding: 0;
      line-height: 1;
    }

    .lp-wa-bubble-close:hover {
      background: #0f172a;
      transform: scale(1.15);
    }

    .lp-wa-bubble-content {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .lp-wa-bubble-wave {
      font-size: 18px;
      line-height: 1.3;
      flex-shrink: 0;
      display: inline-block;
      animation: waveHand 2.4s infinite;
      transform-origin: 70% 70%;
    }

    @keyframes waveHand {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%, 40% { transform: rotate(-14deg); }
      50% { transform: rotate(10deg); }
    }

    .lp-wa-bubble-text {
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 400;
      color: #1e293b;
      line-height: 1.45;
    }

    .lp-wa-bubble-text strong {
      font-weight: 600;
      color: #0f172a;
    }

    .lp-wa-bubble-content:hover .lp-wa-bubble-text {
      color: #0052cc;
    }

    .lp-wa-bubble-arrow {
      position: absolute;
      top: 50%;
      right: -8px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 8px solid #ffffff;
    }

    .lp-whatsapp {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      pointer-events: auto;
      flex-shrink: 0;
      text-decoration: none;
    }

    .lp-whatsapp:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.6);
    }

    .lp-whatsapp img {
      width: 32px;
      height: 32px;
    }

    .lp-wa-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #e53e3e;
      color: #ffffff;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      animation: pulse-badge 2s infinite;
    }

    @keyframes pulse-badge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* RESPONSIVO */
    @media (max-width: 1024px) {
      .lp-header {
        padding: 24px 36px;
      }
      .lp-header-logo img {
        height: 64px;
      }
      .lp-hero {
        padding: 120px 36px 50px;
      }
    }

    @media (max-width: 900px) {
      .lp-hero {
        padding: 110px 24px 50px;
        min-height: auto;
      }
      .lp-hero-overlay {
        background: 
          linear-gradient(
            to bottom,
            rgba(4, 9, 20, 0.94) 0%,
            rgba(4, 9, 20, 0.82) 50%,
            rgba(4, 9, 20, 0.60) 80%,
            rgba(4, 9, 20, 0.90) 100%
          );
      }
      .lp-hero-content {
        max-width: 100%;
      }
      .lp-hero-title {
        font-size: 32px;
      }
    }

    @media (max-width: 768px) {
      .lp-header {
        padding: 18px 20px;
      }
      .lp-header-logo img {
        height: 56px;
      }
      .lp-hero {
        padding: 100px 20px 48px;
      }
      .lp-hero-content {
        transform: translateY(0);
      }
      .lp-hero-title {
        font-size: 28px;
        line-height: 1.25;
      }
      .lp-hero-subtitle {
        font-size: 15px;
        margin-bottom: 24px;
      }
    }

    @media (max-width: 600px) {
      .lp-wa-wrapper {
        bottom: 20px;
        right: 16px;
        gap: 10px;
      }
      .lp-wa-bubble {
        max-width: 210px;
        padding: 11px 13px;
      }
      .lp-wa-bubble-text {
        font-size: 12px;
      }
      .lp-whatsapp {

      }
      .lp-whatsapp img {

    }
  </style>

  <!-- Scripts: Vídeo Autoplay & WhatsApp Bubble -->
  <script>
    // Forçar início do vídeo sem bloqueio do navegador
    const v = document.getElementById('lp-hero-video');
    if (v) {
      v.muted = true;
      v.play().catch(() => {
        const startPlay = () => {
          v.play();
          window.removeEventListener('click', startPlay);
          window.removeEventListener('touchstart', startPlay);
        };
        window.addEventListener('click', startPlay, { once: true });
        window.addEventListener('touchstart', startPlay, { once: true });
      });
    }

    // WhatsApp Speech Bubble dismiss logic
    const waBubble = document.getElementById('lpWaBubble');
    const waBubbleClose = document.getElementById('lpWaBubbleClose');
    if (waBubbleClose && waBubble) {
      waBubbleClose.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        waBubble.classList.add('hidden');
        try {
          sessionStorage.setItem('raizys_wa_bubble_dismissed', 'true');
        } catch(err) {}
      });

      try {
        if (sessionStorage.getItem('raizys_wa_bubble_dismissed') === 'true') {
          waBubble.classList.add('hidden');
        }
      } catch(err) {}
    }
  </script>
